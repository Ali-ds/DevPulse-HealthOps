# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: DevPulse HealthOps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Notify DevPulse — build started
      - name: Notify build started
        run: |
          curl -X POST ${{ secrets.DEVPULSE_WEBHOOK_URL }}/api/deployment/webhook \
          -H "Content-Type: application/json" \
          -d '{
            "version": "${{ github.sha }}",
            "status": "building",
            "branch": "${{ github.ref_name }}",
            "triggered_by": "${{ github.actor }}",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'

      # Run tests
      - name: Run tests
        id: tests
        run: |
          pip install pytest
          pytest tests/ -v --tb=short
        continue-on-error: true

      # Notify DevPulse — test result
      - name: Notify test result
        run: |
          STATUS="${{ steps.tests.outcome }}"
          curl -X POST ${{ secrets.DEVPULSE_WEBHOOK_URL }}/api/deployment/webhook \
          -H "Content-Type: application/json" \
          -d '{
            "version": "${{ github.sha }}",
            "status": "'"$STATUS"'",
            "stage": "test",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'

      # Stop pipeline if tests failed
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3

      # Notify DevPulse — deployment started
      - name: Notify deployment started
        run: |
          curl -X POST ${{ secrets.DEVPULSE_WEBHOOK_URL }}/api/deployment/webhook \
          -H "Content-Type: application/json" \
          -d '{
            "version": "${{ github.sha }}",
            "status": "deploying",
            "stage": "deploy",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ds-monitor-app-ali123'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
        continue-on-error: true

      - name: Wait for app to restart
        run: sleep 30
        

      # Notify DevPulse — deployment success or failure
      - name: Notify deployment result
        continue-on-error: true
        run: |
          STATUS="${{ steps.deploy.outcome == 'success' && 'success' || 'failed' }}"
          curl -X POST ${{ secrets.DEVPULSE_WEBHOOK_URL }}/api/deployment/webhook \
          -H "Content-Type: application/json" \
          -d '{
            "version": "${{ github.sha }}",
            "status": "'"$STATUS"'",
            "stage": "deploy",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }'
          

      - name: Fail if deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
